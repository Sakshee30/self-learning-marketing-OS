name: Frontend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Verify architecture, type safety, production builds and budgets
        run: npm run verify
      - name: Upload customer production bundle
        uses: actions/upload-artifact@v4
        with:
          name: growthos-customer-frontend-dist
          path: ./dist
          if-no-files-found: error
      - name: Upload platform control production bundle
        uses: actions/upload-artifact@v4
        with:
          name: growthos-platform-control-dist
          path: ./dist-platform-admin
          if-no-files-found: error
