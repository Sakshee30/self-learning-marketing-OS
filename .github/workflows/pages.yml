name: Platform CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-and-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install customer/control dependencies
        run: npm install
      - name: Verify architecture, type safety, production builds and budgets
        run: npm run verify
      - name: Upload customer production bundle
        uses: actions/upload-artifact@v4
        with:
          name: growthos-customer-frontend-dist
          path: ./dist
          if-no-files-found: error
      - name: Upload platform control production bundle
        uses: actions/upload-artifact@v4
        with:
          name: growthos-platform-control-dist
          path: ./dist-platform-admin
          if-no-files-found: error

  public-website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install website dependencies
        run: npm install
      - name: Verify website architecture, type safety and production build
        run: npm run check
      - name: Upload static website bundle
        uses: actions/upload-artifact@v4
        with:
          name: growthos-public-website-out
          path: ./website/out
          if-no-files-found: error

  website-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: growthos
          POSTGRES_PASSWORD: growthos
          POSTGRES_DB: growthos_website
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U growthos -d growthos_website"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://growthos:growthos@127.0.0.1:5432/growthos_website
      WEBSITE_ORIGINS: http://localhost:3000
    defaults:
      run:
        working-directory: website-api
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Website API dependencies
        run: npm install
      - name: Apply Website API migrations
        run: npm run db:migrate
      - name: Run PostgreSQL integration tests
        run: npm run test:integration
      - name: Verify Website API type safety, unit tests and build
        run: npm run check

  cms-studio:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: growthos
          POSTGRES_PASSWORD: growthos
          POSTGRES_DB: growthos_cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U growthos -d growthos_cms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://growthos:growthos@127.0.0.1:5432/growthos_cms
      PAYLOAD_SECRET: ci-only-growthos-payload-secret-not-for-production
      PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3003
    defaults:
      run:
        working-directory: cms-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
      - name: Install CMS Studio dependencies
        run: npm install
      - name: Verify CMS Studio types, tests, production build and dependency gate
        run: npm run check
