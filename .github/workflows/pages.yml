name: Frontend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-and-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install customer/control dependencies
        run: npm install
      - name: Verify architecture, type safety, production builds and budgets
        run: npm run verify
      - name: Upload customer production bundle
        uses: actions/upload-artifact@v4
        with:
          name: growthos-customer-frontend-dist
          path: ./dist
          if-no-files-found: error
      - name: Upload platform control production bundle
        uses: actions/upload-artifact@v4
        with:
          name: growthos-platform-control-dist
          path: ./dist-platform-admin
          if-no-files-found: error

  public-website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        run: npm install
      - name: Typecheck and build public website
        run: npm run check
      - name: Upload static website bundle
        uses: actions/upload-artifact@v4
        with:
          name: growthos-public-website-out
          path: ./website/out
          if-no-files-found: error
